<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
    .dino { fill: #535353; }
    .cactus { fill: #535353; }
    .cloud { fill: #cccccc; }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="800" height="200" fill="#ffffff"/>

  <!-- ground -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#535353" stroke-width="2"/>
  <g>
    <line x1="0" y1="160" x2="30" y2="160" stroke="#535353" stroke-width="2"/>
    <line x1="60" y1="160" x2="90" y2="160" stroke="#535353" stroke-width="2"/>
    <line x1="120" y1="160" x2="150" y2="160" stroke="#535353" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="0.8s" repeatCount="indefinite"/>
  </g>

  <!-- clouds -->
  <g class="cloud">
    <rect x="100" y="40" width="40" height="8" rx="3"/>
    <rect x="400" y="60" width="40" height="8" rx="3"/>
    <rect x="650" y="30" width="40" height="8" rx="3"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- cactus, moving toward dino and looping -->
  <g class="cactus">
    <rect x="0" y="120" width="10" height="40"/>
    <rect x="-8" y="128" width="8" height="8"/>
    <rect x="10" y="128" width="8" height="8"/>
    <animateTransform attributeName="transform" type="translate" from="750 0" to="-50 0" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- dino body (fixed x position, small hop) -->
  <g class="dino" transform="translate(60,0)">
    <animateTransform attributeName="transform" type="translate" values="60,0;60,-10;60,0;60,0;60,0;60,0;60,0;60,0" keyTimes="0;0.08;0.16;0.3;0.5;0.7;0.9;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>

    <!-- body -->
    <rect x="0" y="90" width="40" height="30"/>
    <!-- head -->
    <rect x="30" y="70" width="24" height="24"/>
    <!-- eye -->
    <rect x="46" y="76" width="4" height="4" fill="#ffffff"/>
    <!-- tail -->
    <rect x="-10" y="95" width="14" height="8"/>
    <!-- arm -->
    <rect x="30" y="100" width="8" height="6"/>

    <!-- legs, alternating -->
    <g>
      <rect x="6" y="120" width="8" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-6;0,0" keyTimes="0;0.3;0.5;1" dur="0.3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="22" y="120" width="8" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="0,-6;0,0;0,0;0,-6" keyTimes="0;0.3;0.5;1" dur="0.3s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
